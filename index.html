<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>🌤️ Weather App</h1>
        <p>Check the weather of your city</p>
    </header>

    <!-- Main Content -->
    <main>

        <!-- Search -->
        <section class="search-box">
            <input type="text" id="cityInput" placeholder="Enter city name">

            <button onclick="getWeather()">
                Search
            </button>
        </section>

        <!-- Weather Card -->
        <section class="weather-card">

            <h2 id="cityName">Your City</h2>

            <div class="temperature">
                <span id="temperature">--</span>°C
            </div>

            <p id="description">Search for a city to see weather</p>

            <!-- Weather Details -->
            <div class="weather-details">

                <div class="detail">
                    <h3>💧 Humidity</h3>
                    <p id="humidity">--%</p>
                </div>

                <div class="detail">
                    <h3>💨 Wind Speed</h3>
                    <p id="wind">-- km/h</p>
                </div>

                <div class="detail">
                    <h3>🌡️ Feels Like</h3>
                    <p id="feelsLike">--°C</p>
                </div>

            </div>

        </section>

    </main>

    <!-- Footer -->
    <footer>
        <p>Weather App | Weather Information</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
